<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0d3d6e"><title>我的申请 · 海综服</title><link rel="stylesheet" href="tailwind.css"><script src="app.js" defer></script></head>
<body data-page="mine"><a class="sr-only focus:not-sr-only" href="#main">跳至正文</a><header id="site-header"></header><main id="main" class="container-wide pb-16 pt-8"><div class="mb-8 flex flex-wrap items-start justify-between gap-5"><div><p class="eyebrow mb-3">YOUR APPLICATIONS</p><h1 class="text-3xl font-bold text-navy" data-i18n="mine">我的申请</h1><p class="mt-3 text-sm text-muted" data-i18n="mineIntro">查看当前浏览器保存的演示记录，继续完善您的申请资料。</p></div><a class="btn" id="new-application-link" href="index.html#services"><span data-i18n="next">填写申请</span><span data-icon="arrow"></span></a></div>
<div class="mb-6 rounded-xl border border-gold/30 bg-amber-50/60 px-5 py-4 text-sm leading-7 text-[#7d683f]"><p data-i18n="demo">静态前端演示 · 申请仅保存于当前浏览器，不会发送给商会</p><p class="text-xs" data-i18n="mineNotice">没有真实受理进度；清除浏览器数据或更换设备后，这些记录不会保留。</p></div>
<div class="grid items-start gap-7 lg:grid-cols-[250px_minmax(0,1fr)]"><aside class="space-y-5"><div class="panel !p-6"><span class="icon-box" data-icon="mine"></span><h2 class="mt-5 text-sm text-muted" data-i18n="localCount">本机演示记录</h2><p id="application-count" class="mt-2 text-4xl font-bold text-navy">0</p><p class="mt-4 text-xs leading-6 text-muted" data-i18n="countHint">仅统计当前浏览器记录，不代表商会服务成果。</p></div><div class="rounded-xl bg-navy p-6 text-sm leading-7 text-blue-100"><h2 class="mb-3 font-semibold text-white" data-i18n="tracking">申请跟进</h2><p data-i18n="trackingHint">演示记录保存在当前浏览器，可查看、修改或撤回；更换设备不会同步。</p></div></aside><section aria-label="申请记录"><div class="mb-5 flex flex-wrap gap-3"><label class="sr-only" for="application-search">搜索申请</label><input id="application-search" class="field-control min-w-[180px] flex-1" type="search" placeholder="搜索编号、企业或标题"><label class="sr-only" for="kind-filter">申请类型</label><select class="field-control !w-auto" id="kind-filter"><option value="">全部类型</option><option value="company">企业入库</option><option value="service">服务需求</option><option value="cooperation">合作对接</option><option value="activity">活动报名</option><option value="research">调研参与</option><option value="consultation">乌方咨询</option></select><label class="sr-only" for="status-filter">状态</label><select class="field-control !w-auto" id="status-filter"><option value="">全部状态</option><option value="仅本机保存">仅本机保存</option><option value="企业撤回">企业撤回</option></select></div><div id="application-list" class="space-y-4" aria-live="polite"></div></section></div>
</main><footer id="site-footer"></footer><nav id="mobile-nav"></nav><div id="toast" class="hidden rounded-xl bg-navy px-5 py-3 text-sm text-white shadow-soft" role="status" aria-live="polite"></div><div id="modal-root"></div></body></html>
